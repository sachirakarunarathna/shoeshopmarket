<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shoe Shop</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>SOLE STYLE</h1>
    <nav>
      <a href="#home">Home</a>
      <a href="#products">Products</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <section class="hero" id="home">
    <h2>Find Your Perfect Pair</h2>
    <p>Step into style. Walk with confidence.</p>
    <a class="shop-btn" href="#products">Shop Now</a>
  </section>

  <section id="products">
    <h2>Our Shoes</h2>
    <div class="products">
      <div class="product">
        <div class="shoe">👟</div>
        <h3>Classic Sneakers</h3>
        <p>Rs. 8,500</p>
        <button onclick="addToCart('Classic Sneakers')">
          Add to Cart
        </button>
      </div>

      <div class="product">
        <div class="shoe">👞</div>
        <h3>Formal Shoes</h3>
        <p>Rs. 12,000</p>
        <button onclick="addToCart('Formal Shoes')">
          Add to Cart
        </button>
      </div>

      <div class="product">
        <div class="shoe">🥾</div>
        <h3>Sport Shoes</h3>
        <p>Rs. 9,500</p>
        <button onclick="addToCart('Sport Shoes')">
          Add to Cart
        </button>
      </div>
    </div>
  </section>

  <footer id="contact">
    <p>SOLE STYLE | Your everyday footwear store</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
